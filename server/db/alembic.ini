[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
# sqlalchemy.url is deliberately not set here: migrations/env.py takes it from
# server/db/config.py so alembic and the app always use the same file,
# whatever directory alembic is run from.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
